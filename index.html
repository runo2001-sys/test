<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>キャラアニメ（ジャンプ付き）</title>
  <style>
    canvas {
      background: #eef;
      border: 1px solid #333;
      display: block;
      margin: 0 auto;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      gap: 20px;
    }

    .btn {
      width: 80px;
      height: 80px;
      background: #ccc;
      border-radius: 10px;
      font-size: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      touch-action: none;
    }

    .btn:active {
      background: #aaa;
    }
  </style>
</head>
<body>

  <canvas id="game" width="800" height="400"></canvas>

  <div class="controls">
    <div class="btn" id="left">←</div>
    <div class="btn" id="right">→</div>
    <div class="btn" id="jump">⤒</div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // キャラ位置と速度
    let x = 300;
    let y = 100;
    let vy = 0;              // 縦の速度
    const speed = 3;
    const gravity = 0.5;     // 重力
    const jumpPower = -12;   // ジャンプの強さ

    // 地面の高さ（キャラの描画位置の y）
    const groundY = 300;
    let isOnGround = false;

    // スプライト設定
    const frameWidth = 200;
    const frameHeight = 200;
    const frameCount = 4;
    let frameIndex = 0;
    let frameTimer = 0;
    const frameInterval = 10;

    let direction = "right";

    // 入力状態
    const keys = {
      left: false,
      right: false,
      jump: false
    };

    // 画像
    const img = new Image();
    img.src = "character.png"; // 同じフォルダに置く

    // PCキーボード操作
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;
      if (e.key === " " || e.key === "ArrowUp") keys.jump = true;
    });

    document.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft") keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
      if (e.key === " " || e.key === "ArrowUp") keys.jump = false;
    });

    // スマホ用ボタン
    const leftBtn = document.getElementById("left");
    const rightBtn = document.getElementById("right");
    const jumpBtn = document.getElementById("jump");

    leftBtn.addEventListener("touchstart", e => {
      e.preventDefault();
      keys.left = true;
    });
    leftBtn.addEventListener("touchend", e => {
      e.preventDefault();
      keys.left = false;
    });

    rightBtn.addEventListener("touchstart", e => {
      e.preventDefault();
      keys.right = true;
    });
    rightBtn.addEventListener("touchend", e => {
      e.preventDefault();
      keys.right = false;
    });
